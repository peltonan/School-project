<!DOCTYPE html>
<html lang="fi">

<head>
    <title>Opiskelijahaku</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap"
          rel="stylesheet">

    <link href="style_palvelu.css" rel="stylesheet" type="text/css">
</head>

<body>

    <header>
        <img src="opiskelijahaku.png"
             alt="Opiskelijahaun kuvake"
             class="logo">

        <h1>Opiskelijahaku</h1>
    </header>

    <main>
        <section class="search-section">

            <h2>Mitä etsit?</h2>

            <p>
                Etsi opiskeluun tai opiskelija-arkeen liittyvää tietoa.
            </p>

            <form action="sivu2.html">
                <label for="search">Hakusana</label>

                <input
                    type="search"
                    id="search"
                    name="search"
                    placeholder="Esim. opintotuki"
                >

                <button type="submit">Hae</button>
            </form>

        </section>
    </main>

</body>

</html>
